name: study_revision_tracker
description: A Flutter application for tracking study revisions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  supabase_flutter: ^2.9.1
  fl_chart: ^0.71.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.0
  google_generative_ai: ^0.4.6
  table_calendar: ^3.2.0
  speech_to_text: ^7.0.0
  shimmer: ^3.0.0
  record: ^7.1.1
  web_socket_channel: ^2.4.0
  permission_handler: ^11.0.1
  device_calendar: ^4.3.3
  shared_preferences: ^2.3.0
  google_sign_in: ^6.2.2
  just_audio: ^0.10.6
  flutter_sound: ^9.4.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf