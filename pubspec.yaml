name: study_revision_tracker
description: A Flutter application for tracking study revisions.
publish_to: 'none'
version: 1.0.2+2003

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.6.6
  supabase_flutter: ^2.9.1
  app_links: ^7.2.1
  fl_chart: ^0.71.0
  intl: ^0.20.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.0
  table_calendar: ^3.2.0
  shimmer: ^3.0.0
  record: ^7.1.1
  web_socket_channel: ^2.4.0
  device_calendar: ^4.3.3
  shared_preferences: ^2.3.0
  google_sign_in: ^6.2.2
  flutter_sound: ^9.4.15
  flutter_reorderable_grid_view: ^5.7.0
  home_widget: ^0.9.4
  flutter_timezone: ^3.0.1
  workmanager: ^0.6.0
  http: ^1.2.0
  web: ^1.1.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
