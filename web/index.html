<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smart Revision Tracker — spaced study revisions, routines, and voice assistant.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#87CEEB">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Smart Revision Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Smart Revision Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F8F9FC;
      overflow: hidden;
    }
    /* Boot overlay: phone web only. Desktop/tablet never show a loader. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1A1D26;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .logo {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, #87CEEB, #81D4FA);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 22px;
    }
    #boot .msg { font-size: 13px; color: #6B7280; }
    #boot .err {
      font-size: 12px; color: #D93025;
      max-width: 320px; text-align: center; display: none;
    }
    /* Desktop / large tablet / browser: no boot UI at all. */
    @media (min-width: 760px) {
      #boot { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="logo">📚</div>
    <div class="msg">Loading…</div>
    <div class="err" id="boot-err"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () {
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 300);
    });
    window.addEventListener('error', function () {
      var el = document.getElementById('boot-err');
      var boot = document.getElementById('boot');
      if (el && boot && getComputedStyle(boot).display !== 'none') {
        el.style.display = 'block';
        el.textContent = 'Failed to load. Check network / HTTPS and reload.';
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
