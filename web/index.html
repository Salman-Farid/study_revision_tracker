<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smart Revision Tracker — spaced study revisions, routines, and voice assistant.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#87CEEB">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Smart Revision Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Smart Revision Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F8F9FC;
      overflow: hidden;
    }
    /* Minimal boot splash while Flutter loads */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1A1D26;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #87CEEB, #81D4FA);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 28px;
    }
    #boot .msg { font-size: 14px; color: #6B7280; }
    #boot .err { font-size: 13px; color: #D93025; max-width: 320px; text-align: center; display: none; }
  </style>
</head>
<body>
  <div id="boot">
    <div class="logo">📚</div>
    <div class="msg">Loading Smart Revision Tracker…</div>
    <div class="err" id="boot-err"></div>
  </div>

  <script>
    // Hide boot splash when Flutter takes over the first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot');
      if (el) el.classList.add('hide');
      setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 400);
    });
    // Surface load failures instead of a blank page.
    window.addEventListener('error', function (e) {
      var el = document.getElementById('boot-err');
      if (el && document.getElementById('boot')) {
        el.style.display = 'block';
        el.textContent = 'Failed to load. Check network / HTTPS and reload.';
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
