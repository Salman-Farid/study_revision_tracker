<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smart Revision Tracker — spaced study revisions, routines, and voice assistant.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#87CEEB">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Smart Revision Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Smart Revision Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F8F9FC;
      overflow: hidden;
    }
    /* Orbital feature loader — same idea as Flutter SplashFeatureOrbit.
       Shows immediately while main.dart.js downloads; Flutter continues it. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F9FC;
      z-index: 9999;
      transition: opacity 0.45s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #boot.hide { opacity: 0; pointer-events: none; }

    .orbit-stage {
      position: relative;
      width: min(86vw, 640px);
      height: min(86vw, 640px);
    }
    .orbit-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 72px;
      height: 72px;
      margin: -36px 0 0 -36px;
      border-radius: 50%;
      background: rgba(135, 206, 235, 0.16);
      border: 1px solid rgba(135, 206, 235, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      z-index: 2;
    }
    .orbit-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(140px, 28vw, 220px);
      height: clamp(74px, 14.5vw, 114px);
      border-radius: 14px;
      overflow: hidden;
      border: 1.2px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14);
      background: #e8ecf4;
      will-change: transform;
    }
    /* Skeleton only until the photo is ready — then class is removed. */
    .orbit-card.is-loading::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 30%,
        rgba(255, 255, 255, 0.55) 50%,
        transparent 70%
      );
      transform: translateX(-100%);
      animation: orbit-shimmer 1.4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes orbit-shimmer {
      100% { transform: translateX(100%); }
    }
    .orbit-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #boot .err {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #D93025;
      max-width: 320px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="orbit-stage" id="orbit-stage" aria-label="Loading features">
      <div class="orbit-card is-loading" data-i="0">
        <img src="assets/assets/images/splash_feature_revision.png" alt="Spaced Revision" />
      </div>
      <div class="orbit-card is-loading" data-i="1">
        <img src="assets/assets/images/splash_feature_routines.png" alt="Routines" />
      </div>
      <div class="orbit-card is-loading" data-i="2">
        <img src="assets/assets/images/splash_feature_voice.png" alt="Putu Voice AI" />
      </div>
      <div class="orbit-card is-loading" data-i="3">
        <img src="assets/assets/images/splash_feature_progress.png" alt="Progress" />
      </div>
      <div class="orbit-center">📚</div>
    </div>
    <div class="err" id="boot-err"></div>
  </div>

  <script>
    // Round-table orbit: four wide feature cards circle the center, upright,
    // while the whole ring breathes (inhale/exhale) like a calm loader.
    (function () {
      var stage = document.getElementById('orbit-stage');
      var cards = stage ? stage.querySelectorAll('.orbit-card') : [];
      // Drop skeleton shimmer once each feature photo has decoded.
      for (var ci = 0; ci < cards.length; ci++) {
        (function (card) {
          var img = card.querySelector('img');
          if (!img) {
            card.classList.remove('is-loading');
            return;
          }
          function done() { card.classList.remove('is-loading'); }
          if (img.complete && img.naturalWidth > 0) done();
          else {
            img.addEventListener('load', done);
            img.addEventListener('error', done);
          }
        })(cards[ci]);
      }
      var t0 = performance.now();
      function frame(now) {
        if (!stage || !stage.isConnected) return;
        var t = (now - t0) / 1000;
        var spin = (t / 28) * Math.PI * 2;
        var breath = 0.5 + 0.5 * Math.sin((t / 3.2) * Math.PI * 2);
        var scale = 0.92 + breath * 0.14;
        stage.style.transform = 'scale(' + scale + ')';
        stage.style.opacity = String(0.62 + breath * 0.38);
        var radius = Math.min(stage.clientWidth, stage.clientHeight) * 0.42;
        for (var i = 0; i < cards.length; i++) {
          var card = cards[i];
          var a = spin + i * Math.PI / 2;
          var x = Math.cos(a) * radius;
          var y = Math.sin(a) * radius;
          var hw = card.offsetWidth / 2;
          var hh = card.offsetHeight / 2;
          // Keep cards upright (translate only) while they orbit.
          card.style.transform = 'translate(' + (x - hw) + 'px,' + (y - hh) + 'px)';
        }
        requestAnimationFrame(frame);
      }
      if (cards.length) requestAnimationFrame(frame);
    })();

    // HTML orbit = same UI as Flutter SplashFeatureOrbit (📚 in center).
    // Flutter continues it; hold in-app is ~3s then auth/home.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () {
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 280);
    });
    window.addEventListener('error', function () {
      var el = document.getElementById('boot-err');
      var boot = document.getElementById('boot');
      if (el && boot && getComputedStyle(boot).display !== 'none') {
        el.style.display = 'block';
        el.textContent = 'Failed to load. Check network / HTTPS and reload.';
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
